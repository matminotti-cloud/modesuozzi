# Erzeugt index.html, impressum.html, datenschutz.html, sitemap.xml, robots.txt und llms.txt aus content/site.json
# (nach jeder Änderung, auch aus Pages CMS) und veröffentlicht die Testversion auf GitHub Pages.
name: Website erzeugen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: PHP-Dateien prüfen
        run: for f in admin.php lib/*.php lib/seiten/*.php; do php -l "$f"; done

      - name: Seite erzeugen
        run: php lib/render.php

      - name: Erzeugte Dateien speichern
        run: |
          git add index.html impressum.html datenschutz.html sitemap.xml robots.txt llms.txt
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Website aus content/site.json erzeugt"
            git pull --rebase --autostash && git push
          fi

      - name: Dateien für GitHub Pages zusammenstellen
        run: |
          mkdir _site
          cp -r index.html impressum.html datenschutz.html sitemap.xml robots.txt llms.txt images fonts _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
