  const q = encodeURIComponent([c.besuch?.firma, c.besuch?.strasse, c.besuch?.ort].filter(Boolean).join(', '));
  const map = document.getElementById('map');
  map.src = 'https://www.google.com/maps?q=' + q + '&output=embed';
  map.title = 'Karte: ' + [c.besuch?.strasse, c.besuch?.ort].filter(Boolean).join(', ');

  // Über uns: Absätze
  const about = document.getElementById('about-text');
  (c.ueber_uns?.text || '').split(/\n\s*\n/).filter(has).forEach(t => {
    const p = document.createElement('p'); p.textContent = t.trim(); about.appendChild(p);
  });

  // ---------- Sortiment ----------
  const month = new Date().getMonth() + 1;
  let current = c.sortiment?.aktuelle_saison || 'automatisch';
  if (current === 'automatisch') current = month >= 3 && month <= 8 ? 'fruehling_sommer' : 'herbst_winter';
  document.querySelectorAll('.season').forEach(art => {
    const key = art.dataset.season, isNow = key === current;
    art.classList.toggle('off', !isNow);
    art.querySelector('.state').textContent = isNow ? 'Jetzt im Laden' : (key === 'herbst_winter' ? 'Ab Herbst' : 'Ab Frühling');
    const ul = art.querySelector('ul');
    (c.sortiment?.[key] || []).forEach(it => {
      const li = document.createElement('li');
      const a = document.createElement('span'); a.textContent = it.artikel || '';
      const b = document.createElement('span'); b.textContent = it.marke || '';
      li.append(a, b); ul.appendChild(li);
    });
  });

  // ---------- Marken ----------
  const brands = document.getElementById('brands');
  (c.marken?.liste || []).forEach(m => {
    const li = document.createElement('li');
    if (has(m.link) && /^https?:\/\//.test(m.link)) {
      const a = document.createElement('a'); a.href = m.link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = m.name;
      li.appendChild(a);
    } else li.textContent = m.name;
    brands.appendChild(li);
  });

  // ---------- Öffnungszeiten ----------
  const DAYS = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const parts = new Intl.DateTimeFormat('de-CH', { timeZone: 'Europe/Zurich', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
  const today = DAYS.indexOf(parts.find(p => p.type === 'weekday').value.slice(0, 2));
  const now = +parts.find(p => p.type === 'hour').value * 60 + +parts.find(p => p.type === 'minute').value;
  const toMin = s => { const [h, m] = s.split(/[:.]/).map(Number); return h * 60 + (m || 0); };
  const tbody = document.getElementById('hours');
  let open = false;
  (c.besuch?.oeffnungszeiten || []).forEach(z => {
    const tr = document.createElement('tr');
    const th = document.createElement('th'); th.scope = 'row'; th.textContent = z.bezeichnung || '';
    const td = document.createElement('td');
    const slots = [...(z.zeiten || '').matchAll(/(\d{1,2}[:.]\d{2})\s*[–—-]\s*(\d{1,2}[:.]\d{2})/g)].map(m => [toMin(m[1]), toMin(m[2])]);
    td.innerHTML = '';
    (slots.length ? (z.zeiten || '').split(/\s*,\s*/) : [z.zeiten || '']).forEach((t, i) => {
      if (i) td.appendChild(document.createElement('br'));
      td.appendChild(document.createTextNode(t.replace(/\s*[–—-]\s*/, ' – ')));
    });
    if ((z.tage || []).map(d => DAYS.indexOf(d)).includes(today)) {
      tr.classList.add('today');
      if (slots.some(([a, b]) => now >= a && now < b)) open = true;
    }
    tr.append(th, td); tbody.appendChild(tr);
  });
  const st = document.getElementById('status');
  st.hidden = false; st.textContent = open ? 'Jetzt geöffnet' : 'Zurzeit geschlossen';
  st.classList.toggle('open', open);

  document.getElementById('year').textContent = new Date().getFullYear();
  document.body.classList.remove('loading');
})();

// Mobiles Menü
const btn = document.querySelector('.menu-btn'), nav = document.getElementById('nav');
btn.addEventListener('click', () => btn.setAttribute('aria-expanded', nav.classList.toggle('open')));
nav.addEventListener('click', e => { if (e.target.tagName === 'A') { nav.classList.remove('open'); btn.setAttribute('aria-expanded', false); } });
</script>
</body>
</html>
